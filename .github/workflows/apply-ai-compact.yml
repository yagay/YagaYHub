name: Apply compact AI entry

on:
  push:
    paths:
      - scripts/one_shot_ai_compact.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch source
        run: python3 scripts/one_shot_ai_compact.py

      - name: Commit source and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/YagaYHub/MainActivity.kt
          git rm -f scripts/one_shot_ai_compact.py
          git rm -f .github/workflows/apply-ai-compact.yml
          if [ -f .github/workflows/one-shot-ai-compact.yml ]; then
            git rm -f .github/workflows/one-shot-ai-compact.yml
          fi
          git commit -m "Use compact retained UI for AI entry"
          git push origin HEAD:main
