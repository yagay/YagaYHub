name: One-shot AI compact migration

on:
  push:
    paths:
      - .github/workflows/one-shot-ai-compact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Switch AI click to compact browser UI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/yagay/YagaYHub/MainActivity.kt')
          text = path.read_text()

          start = text.index('private fun openChatPopup(')
          end = text.index('\nprivate fun openUrl(', start)

          replacement = '''private fun openChatPopup(
    context: Context,
    url: String?,
    bindingRepoKey: String? = null,
    bindingProject: String? = null,
    bindingTitle: String? = null,
) {
    val compactIntent = Intent(YBROWSER_OPEN_BROWSER_ACTION).apply {
        setClassName(
            YBROWSER_PACKAGE,
            YBROWSER_EMBEDDED_ACTIVITY,
        )

        url?.takeIf {
            it.isNotBlank()
        }?.let {
            putExtra(
                YBROWSER_EXTRA_URL,
                it,
            )
        }

        putExtra(
            YBROWSER_EXTRA_YAGAYHUB_BINDING_MODE,
            true,
        )
        putExtra(
            YBROWSER_EXTRA_YAGAYHUB_COMPACT_MODE,
            true,
        )
        putExtra(
            YBROWSER_EXTRA_YAGAYHUB_EMBEDDED,
            true,
        )
        putExtra(
            EXTRA_CHAT_TARGETS_JSON,
            chatTargetsJson(context),
        )

        if (!bindingRepoKey.isNullOrBlank()) {
            putExtra(
                EXTRA_CHAT_BIND_REPO,
                bindingRepoKey,
            )
            putExtra(
                EXTRA_CHAT_BIND_PROJECT,
                bindingProject.orEmpty(),
            )
            putExtra(
                EXTRA_CHAT_BIND_TITLE,
                bindingTitle.orEmpty(),
            )
        }

        // Reuse an existing compact host whenever it is already in the
        // YagaYHub task. Browser sessions themselves live in YBrowser's
        // retained pool, so bringing the host back must not recreate or
        // reload the bound ChatGPT page.
        addFlags(
            Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or
                Intent.FLAG_ACTIVITY_SINGLE_TOP,
        )
    }

    try {
        context.startActivity(compactIntent)
    } catch (_: ActivityNotFoundException) {
        Toast.makeText(
            context,
            "请先安装或更新 YBrowser",
            Toast.LENGTH_SHORT,
        ).show()
    }
}
'''

          text = text[:start] + replacement + text[end:]

          text = text.replace(
              'private const val YBROWSER_OPEN_AI_ACTION =\n    "com.yagay.YBrowser.action.OPEN_AI"\n',
              ''
          )
          text = text.replace(
              'private const val YBROWSER_AI_WORKSPACE_ACTIVITY =\n    "com.yagay.ybrowser.ai.AiWorkspaceActivity"\n',
              ''
          )

          path.write_text(text)
          PY

      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/YagaYHub/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source change"
            exit 0
          fi
          git commit -m "Use compact retained UI for AI entry"
          git push origin HEAD:main
