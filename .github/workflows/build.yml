name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply stale project cleanup fix
        if: github.event_name == 'push'
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          if ! git diff --quiet -- app/src/main/java/com/yagay/YagaYHub/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/yagay/YagaYHub/MainActivity.kt
            git commit -m "Hide removed uninstalled projects"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        env:
          YAGAY_GITHUB_CLIENT_ID: ${{ secrets.YAGAY_GITHUB_CLIENT_ID }}
          YAGAY_GITHUB_CLIENT_SECRET: ${{ secrets.YAGAY_GITHUB_CLIENT_SECRET }}
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YagaYHub-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
