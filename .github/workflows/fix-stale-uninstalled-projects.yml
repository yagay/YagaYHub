name: Fix stale uninstalled projects

on:
  push:
    paths:
      - .github/workflows/fix-stale-uninstalled-projects.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale project filtering
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/yagay/YagaYHub/MainActivity.kt")
          text = path.read_text()

          old = '''            val loadedApps = loadHubApps(context)
            val mergedApps = withContext(Dispatchers.IO) {
                mergeGithubRepositories(
                    apps = loadedApps,
                    repositories = fetchOwnedRepositories(githubToken),
                )
            }
'''
          new = '''            val loadedApps = loadHubApps(context)
            val mergedApps = withContext(Dispatchers.IO) {
                val repositories = fetchOwnedRepositories(githubToken)
                mergeGithubRepositories(
                    apps = loadedApps,
                    repositories = repositories,
                    pruneMissingKnownProjects = githubToken.isNotBlank(),
                )
            }
'''
          if old not in text:
              raise SystemExit("initial merge block not found")
          text = text.replace(old, new, 1)

          old = '''private fun mergeGithubRepositories(
    apps: List<HubApp>,
    repositories: List<GithubRepository>,
    resetActionsStatus: Boolean = true,
): List<HubApp> {
'''
          new = '''private fun mergeGithubRepositories(
    apps: List<HubApp>,
    repositories: List<GithubRepository>,
    resetActionsStatus: Boolean = true,
    pruneMissingKnownProjects: Boolean = false,
): List<HubApp> {
'''
          if old not in text:
              raise SystemExit("merge signature not found")
          text = text.replace(old, new, 1)

          old = '''        existingRepos += key
    }

    return result.sortedWith(
'''
          new = '''        existingRepos += key
    }

    if (pruneMissingKnownProjects) {
        val currentRepoKeys = repositories
            .mapTo(mutableSetOf()) { repository ->
                (repository.owner + "/" + repository.name).lowercase()
            }

        result.removeAll { app ->
            val repo = app.repo
            !app.installed &&
                !app.repoOnly &&
                repo != null &&
                (app.repoOwner + "/" + repo).lowercase() !in currentRepoKeys
        }
    }

    return result.sortedWith(
'''
          if old not in text:
              raise SystemExit("merge return block not found")
          text = text.replace(old, new, 1)

          old = '''    val merged = mergeGithubRepositories(
        apps = apps,
        repositories = repositories,
        resetActionsStatus = false,
    )
'''
          new = '''    val merged = mergeGithubRepositories(
        apps = apps,
        repositories = repositories,
        resetActionsStatus = false,
        pruneMissingKnownProjects = token.isNotBlank(),
    )
'''
          if old not in text:
              raise SystemExit("dynamic merge block not found")
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/YagaYHub/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Hide removed uninstalled projects"
          git push origin HEAD:main
